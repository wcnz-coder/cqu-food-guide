<header class="mast frame">
    <a class="brand" href="./"><span class="avatar-crop"><img src="cqu-avatar.jpg" width="1280" height="2781" alt=""></span><span class="brand-copy"><b>重大开饭</b><small>CQU FOOD INDEX</small></span></a>
    <nav aria-label="主导航"><a href="./">首页</a><a href="guide.html" aria-current="page">红黑榜</a><a href="sources.html">数据</a></nav>
    <a class="nav-cta" href="#guide">查榜 <span aria-hidden="true">↗</span></a>
  </header>
  <main id="main" class="frame">
    <section class="directory section" id="guide" aria-labelledby="guide-title">
      <div class="page-intro">
        <div><p class="eyebrow">02 / THE CQU DIRECTORY</p><h1 id="guide-title">重大美食红黑榜</h1><p class="page-deck">学生原表怎么分榜，这里就怎么记。网络评分单独展示。</p></div>
        <svg class="doodle page-doodle" viewBox="0 0 72 72" aria-hidden="true"><use href="doodles.svg#bowl"/></svg>
        <button id="surprise" class="outline" type="button">在当前筛选中抽一家红榜 <span aria-hidden="true">↝</span></button>
      </div>
      <form id="filters" role="search">
        <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg><input name="q" type="search" aria-label="搜索食物、店名或校区" placeholder="搜店名、菜品或校区"><kbd>/</kbd></label>
        <label class="select"><span>校区</span><select name="zone" aria-label="校区"><option value="">全部校区</option></select></label>
        <label class="select"><span>品类</span><select name="category" aria-label="品类"><option value="">全部品类</option></select></label>
        <label class="select"><span>预算</span><select name="budget" aria-label="预算"><option value="">不限</option><option value="15">15 元以内</option><option value="25">25 元以内</option><option value="50">50 元以内</option></select></label>
        <label class="select"><span>来源</span><select name="evidence" aria-label="来源"><option value="">全部来源</option><option value="cross">有平台参考</option><option value="association">饭协原表</option><option value="campus-a">A 区原表</option></select></label>
        <label class="select"><span>人数</span><select name="party" aria-label="用餐人数" aria-describedby="party-note"><option value="">不限</option><option value="one">1 人 · 独食</option><option value="two">2 人 · 约会</option><option value="few">3–5 人 · 小聚</option><option value="many">6 人以上 · 聚餐</option></select></label>
        <label class="select"><span>用餐方式</span><select name="service" aria-label="用餐方式" aria-describedby="service-note"><option value="">不限</option><option value="dine-in">堂食</option><option value="delivery">外卖</option></select></label>
        <p class="filter-note" id="party-note">人数依据餐型与已知场景筛选，不代表有空桌、能拼桌或能包场。</p>
        <p class="filter-note" id="service-note">堂食按原表可识别的食堂条目筛选；外卖只看原表明确标注，不代表当前可配送。</p>
        <button type="button" class="linkbtn spot-filter" id="clear-spot" hidden></button>
      </form>
      <div class="tier-row"><span class="filter-label" aria-hidden="true">榜单</span><div class="tiers" id="tiers" role="group" aria-label="榜单类型"></div></div>
      <div class="results-top"><output id="result-count" aria-live="polite" tabindex="-1"></output><button class="linkbtn" id="reset" hidden>清空筛选</button></div>
      <div id="results" class="cards"></div>
      <noscript><p class="empty">请启用 JavaScript 浏览榜单，或前往数据页查看原表。</p></noscript>
      <div id="pagination" aria-label="翻页"></div>
    </section>

</main>
